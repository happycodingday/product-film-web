<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product Film Web</title><link rel="stylesheet" href="film.css"><link rel="stylesheet" href="paperskill-theme.css"></head>
<body><header><strong id="brand"></strong><span>Product Film Web</span></header><main id="viewport"><div id="stage" aria-label="Animated product film"></div></main>
<footer><div class="transport"><button id="replay">Replay R</button><button id="play">Play</button><button id="previous" aria-label="Previous scene">‹</button><button id="next" aria-label="Next scene">›</button><span id="time"></span><input id="seek" type="range" min="0" step="0.01" value="0" aria-label="Film progress"><select id="speed" aria-label="Playback speed"><option value="1">1×</option><option value="0.75">0.75×</option><option value="1.25">1.25×</option></select><button id="sound">No music</button><input id="volume" type="range" min="0" max="1" step="0.05" value="0.5" aria-label="Volume"><button id="clean">Clean H</button><button id="fullscreen">Fullscreen F</button></div><nav id="chapters" aria-label="Chapters"></nav></footer>
<audio id="music" preload="metadata"></audio><script src="config.js"></script><script src="film.js"></script></body></html>
